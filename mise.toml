# Every tool the repo needs, each pinned to an exact version; mise.lock records
# what they resolve to. Renovate bumps them (renovate.json).
[tools]
actionlint = "1.7.12"
biome = "2.5.15"
jq = "1.8.2"
just = "1.58.0"
ruff = "0.16.10"
shellcheck = "0.11.0"

[settings]
lockfile = true
lockfile_platforms = ["macos-arm64", "linux-x64"]
