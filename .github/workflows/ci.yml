# Continuous integration, run by hand and on Renovate's pull requests, which no
# laptop checks: `just lint` and `just test`, with the toolchain from mise.toml. The
# git hooks are the CI (hk.pkl: `just lint` before a commit, `just check` before a
# push). The smoke tests also run on macOS, whose /bin/bash 3.2 is what most
# colleagues' status lines run under.
name: CI

on:
  workflow_dispatch:
  # Renovate's pull requests, which no laptop checks: each job runs on them alone
  # (`if:` below), a human pull request runs none.
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # A job installs only the tools it needs; `mise exec` must not fetch the rest.
  MISE_EXEC_AUTO_INSTALL: "false"

jobs:
  lint:
    name: Lint (just lint)
    if: github.event_name != 'pull_request' || github.event.pull_request.user.login == 'renovate[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca # v5.1.1
        with:
          install_args: just shellcheck actionlint biome ruff
      - run: just lint

  test:
    name: Smoke tests (just test, ${{ matrix.os }})
    if: github.event_name != 'pull_request' || github.event.pull_request.user.login == 'renovate[bot]'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-26]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca # v5.1.1
        with:
          install_args: just jq
      # The handover terminal contract skips the hosts it does not find.
      - name: Install tmux
        run: |
          if [ "$RUNNER_OS" = Linux ]; then sudo apt-get install -y tmux; else brew install tmux; fi
      - run: just test

  required-checks:
    name: required-checks
    needs: [lint, test]
    # always(), not !cancelled(): a cancelled run must fail required-checks, not skip it
    # (GitHub counts a skipped required check as passing).
    if: always() && (github.event_name != 'pull_request' || github.event.pull_request.user.login == 'renovate[bot]')
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca # v5.1.1
        with:
          install_args: just
      # Skipped jobs are fine (the change did not need them); a failed or
      # cancelled one is not. The matrix's legs count as one result.
      - run: |
          # shellcheck disable=SC2086 # one argument per job result
          just ci-verdict $RESULTS
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
